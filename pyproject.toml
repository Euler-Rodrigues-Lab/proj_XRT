[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-xrt"
version = "0.1.0"
description = "Extended-Reality Teleoperation for Unitree G1 and Inspire tactile hands."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "g1-teleop",
    "numpy<2",
    "scipy",
    "mujoco>=3",
    "PyYAML",
    "eurola-xrt-devices[xr,recording]==0.1.2",
]

[project.optional-dependencies]
hardware = ["pymodbus>=3.10", "pyserial", "dynamixel-sdk", "unitree-sdk2py"]
study = [
    "PyQt5",
    "opencv-python",
    "pupil-apriltags",
    "pyrealsense2",
]
transcription = ["faster-whisper", "sounddevice", "speechbrain"]
test = ["pytest", "eurola-geo-kin-core[fallback]==0.1.2"]

[project.scripts]
xrt-g1 = "proj_xrt.cli:teleop"
xrt-study = "proj_xrt.cli:study"

[tool.setuptools.packages.find]
include = ["proj_xrt*", "projects*", "ostrich_neck*"]

[tool.setuptools.package-data]
"projects.g1_full_body_kinematic" = ["config/*.yaml", "g1/meshes/*"]
"projects.g1_upper_body_teleop" = ["*.yaml"]
"projects.inspire_hand_teleop" = [
    "*.json",
    "*.md",
    "*.service",
    "*.txt",
    "g1_with_inspire_hand/*.urdf",
    "g1_with_inspire_hand/*.xml",
    "twin_assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
g1-teleop = { path = "external/g1_teleop", editable = true }

unitree-sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git" }
